name: rust

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup show

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: Core purity check
        run: sh scripts/check-core-purity.sh

      # 私有 API（MediaRemote、dlopen/dlsym）只准出現在 platform-macos 的 helper/ 與 mediaremote_control.rs。
      - name: Private API fence
        if: runner.os == 'macOS'
        run: sh scripts/check-private-api.sh

      - name: Test musicat-core
        run: cargo test -p musicat-core --features testing

      # Windows 只要求編譯通過（未在實機驗證）。
      - name: Build musicat-platform-windows
        run: cargo build -p musicat-platform-windows

      # platform-macos 在非 macOS 目標編成空 crate（build.rs 不呼叫 C 編譯器）。
      - name: Check musicat-platform-macos (empty crate on Windows)
        if: runner.os == 'Windows'
        run: cargo check -p musicat-platform-macos

      # 以下僅 macOS：需要 GPUI / AppKit 的工作區其他部分。
      # 有螢幕才能跑的測試以 #[ignore] 標記，不進 CI。
      - name: Clippy
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        if: runner.os == 'macOS'
        run: cargo build --workspace

      - name: Test workspace
        if: runner.os == 'macOS'
        run: cargo test --workspace

      # Swift → Rust 測試移植對照：Rust #[test] 數不得少於 Swift 案例數（無豁免時）。
      - name: Swift/Rust test parity
        if: runner.os == 'macOS'
        run: sh scripts/parity.sh
