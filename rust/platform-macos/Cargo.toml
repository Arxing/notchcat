[package]
name = "musicat-platform-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
musicat-core = { path = "../core" }
# helper 線上格式的逐欄位解析（與 musicat-core 同一組 feature）。不用 serde derive：缺值與型別錯誤要自己判。
serde_json = { version = "1", default-features = false, features = ["std"] }
# artworkData 的 base64 解碼。純 Rust、MIT OR Apache-2.0；關掉預設的 simd-unsafe 以免引入 unsafe 加速路徑。
base64 = { version = "0.23", default-features = false, features = ["alloc"] }

# 載入私有 MediaRemote 框架（只在 macOS 才相依；動態載入的 unsafe 由它封裝）。ISC 授權，無其他相依。
[target.'cfg(target_os = "macos")'.dependencies]
libloading = "0.8"

[dev-dependencies]
# 測試替身（FakeClock、LocalSpawner）。
musicat-core = { path = "../core", features = ["testing"] }

# build.rs 只在目標為 macOS 時才動用 C 編譯器；其他目標它什麼也不做，
# crate 編成只有兩個字串常數的空 crate。
[build-dependencies]
cc = "1"
